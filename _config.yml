# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Ice 的博客
subtitle: '用心记录思想'
description: '安静地坐着学习'
keywords:
author: Ice
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://tonymistark.github.io/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
# theme: landscape
# theme: BlueLake
# theme: one-paper
theme: next
# Theme configuration (official NexT way: Alternate Theme Config)
## https://theme-next.js.org/docs/getting-started/configuration
theme_config:
  scheme: Gemini
  motion:
    enable: false
  # 站点头像(侧边栏)
  avatar:
    # 微信头像 CDN 链接，/64 为尺寸参数，可改大提高清晰度
    url: "https://wx.qlogo.cn/mmopen/UiabPyeJOmecvBEvkyMkjrXHvziaHiabqpm1wicmHibkupRsntBatfmbLaQdiatLgdCuC7cx7dflGA0eKtluF8XT5icpTiaFiay2PTE9N/64"
    rounded: true
  # 侧边栏社交图标
  social:
    GitHub: "https://github.com/TonyMistark || fab fa-github"
    E-Mail: "mailto:tony_mistark@163.com || fa fa-envelope"
  # 顶部导航菜单
  menu:
    home: / || fa fa-home
    about: /about/ || fa fa-user
    tags: /tags/ || fa fa-tags
    categories: /categories/ || fa fa-th
    archives: /archives/ || fa fa-archive
  # 站内搜索(配合 hexo-generator-searchdb 插件)
  local_search:
    enable: true
  # 评论区(Gitalk,基于 GitHub Issue)
  comments:
    active: gitalk
    storage: true
  gitalk:
    enable: true
    github_id: TonyMistark
    repo: tonymistark.github.io
    client_id: 298b6503f44953bd4193
    # client_secret 不写入配置文件：由 scripts/gitalk-secret.js 从本地 .env 注入，
    # 避免敏感信息提交到公开仓库
    client_secret:
    admin_user: TonyMistark
    language: zh-CN

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:TonyMistark/tonymistark.github.io.git
  branch: gh-pages

# Local search (插件 hexo-generator-searchdb)
## NexT 导航菜单的搜索框读取该数据文件
search:
  path: search.xml
  field: post
