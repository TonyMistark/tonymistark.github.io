name: auto publish Pages

on:
  push:
    branches:
      - master
      - hexo
      - hexo-dev

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-npm-cache-

      - name: Install Dependencies
        run: npm ci

      # Gitalk client_secret 不进 git 仓库，由 GitHub Actions Secret 注入本地 .env
      # 仓库 Settings → Secrets and variables → Actions 添加：GITALK_CLIENT_SECRET
      - name: Inject Gitalk client_secret
        run: |
          if [ -n "${{ secrets.GITALK_CLIENT_SECRET }}" ]; then
            echo "GITALK_CLIENT_SECRET=${{ secrets.GITALK_CLIENT_SECRET }}" >> .env
          fi

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # GitHub Pages 从 hexo 分支发布(自定义域名 CNAME 也在该分支)
          publish_branch: hexo